# Pipeline card: five questions, answered before the pipeline ships.
# The runner reads this file, so the answers are not just documentation:
# the thresholds below are the ones the checks enforce.

name: daily_transactions

# 1. Where does the data come from?
source:
  system: partner payments feed (made up; generated by week1/data/generate.py)
  owner: payments-feed-team          # fictional; the people who warn you about changes
  format: CSV, one rolling file covering the last 5 business days
  contract_columns: [txn_id, txn_date, account_id, amount, currency, merchant_category]

# 2. How fresh does it need to be?
freshness:
  schedule: daily, before the 08:00 dashboard refresh
  max_lag_days: 1                    # newest txn_date may be at most 1 day behind as-of

# 3. What happens when it breaks?
on_failure:
  action: stop                       # stop = do not load, keep yesterday's table; warn = load anyway and alert

# 4. Who gets paged?
on_call:
  primary: data-platform-oncall      # one named rota, not "everyone"
  escalation: payments-feed-team

# 5. How do you know it's right?
correctness:
  min_rows: 450                      # the clean feed has 486 rows; a big drop means something upstream changed
  unique_key: txn_id
  not_null: [txn_id, txn_date, account_id, amount, currency]
  allowed_currencies: [INR, USD, EUR, GBP]
